# Publishes the static exhibit (web/ with the pre-computed performances) to GitHub Pages.
name: pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions: { contents: read, pages: write, id-token: write }
concurrency: { group: pages, cancel-in-progress: true }
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm ci
        working-directory: web
      - run: npx vite build
        working-directory: web
        # repository variables: LIVE_URL, the live server's public address (a tunnel to the Spark); PAGES_BASE, the
        # site's path ("/" on a custom domain; unset: /<repo>/, the github.io project path)
        env: { BTM_BASE: "${{ vars.PAGES_BASE || format('/{0}/', github.event.repository.name) }}", VITE_LIVE_URL: "${{ vars.LIVE_URL }}" }
      - uses: actions/upload-pages-artifact@v3
        with: { path: web/dist }
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment: { name: github-pages, url: "${{ steps.d.outputs.page_url }}" }
    steps:
      - id: d
        uses: actions/deploy-pages@v4
